# Postgres local SÓ para desenvolvimento e testes e2e (nunca produção).
#   docker compose up -d      (ou: podman compose up -d)
# Cria dois bancos: "dutrail" (dev) e "dutrail_test" (e2e).
# Escuta só em loopback (127.0.0.1): não fica acessível pela rede local.
# A senha padrão "dutrail" é a que o .env.test usa; para trocar, defina
# POSTGRES_PASSWORD no ambiente (vale só na criação do volume pgdata).
services:
  postgres:
    image: postgres:17-alpine
    ports:
      - '127.0.0.1:5433:5432'
    environment:
      POSTGRES_USER: dutrail
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dutrail}
      POSTGRES_DB: dutrail
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro

volumes:
  pgdata:
